services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: creative_quality
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    build: .
    restart: unless-stopped
    command: bash ./start.sh
    ports:
      - "8055:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/creative_quality
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - STORAGE_DIR=/app/uploads
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:3000,https://tribev2.vaisakhpv.space}
      - RUNPOD_API_KEY=${RUNPOD_API_KEY}
      - RUNPOD_TEMPLATE_ID=${RUNPOD_TEMPLATE_ID}
      - RUNPOD_GPU_TYPES=${RUNPOD_GPU_TYPES:-NVIDIA RTX A4000,NVIDIA RTX A5000,NVIDIA A40}
      - RUNPOD_IDLE_TIMEOUT_SECONDS=${RUNPOD_IDLE_TIMEOUT_SECONDS:-120}
      - TRIBEV2_API_BASE_URL=${TRIBEV2_API_BASE_URL:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - .:/app
      - uploads_data:/app/uploads
    depends_on:
      - db
      - redis

  worker:
    build: .
    restart: unless-stopped
    command: celery -A worker.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/creative_quality
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - STORAGE_DIR=/app/uploads
      - RUNPOD_API_KEY=${RUNPOD_API_KEY}
      - RUNPOD_TEMPLATE_ID=${RUNPOD_TEMPLATE_ID}
      - RUNPOD_GPU_TYPES=${RUNPOD_GPU_TYPES:-NVIDIA RTX A4000,NVIDIA RTX A5000,NVIDIA A40}
      - RUNPOD_IDLE_TIMEOUT_SECONDS=${RUNPOD_IDLE_TIMEOUT_SECONDS:-120}
      - TRIBEV2_API_BASE_URL=${TRIBEV2_API_BASE_URL:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - .:/app
      - uploads_data:/app/uploads
    depends_on:
      - db
      - redis

  celery-beat:
    build: .
    restart: unless-stopped
    command: celery -A worker.celery_app beat --loglevel=info
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - RUNPOD_API_KEY=${RUNPOD_API_KEY}
      - RUNPOD_TEMPLATE_ID=${RUNPOD_TEMPLATE_ID}
      - RUNPOD_GPU_TYPES=${RUNPOD_GPU_TYPES:-NVIDIA RTX A4000,NVIDIA RTX A5000,NVIDIA A40}
      - RUNPOD_IDLE_TIMEOUT_SECONDS=${RUNPOD_IDLE_TIMEOUT_SECONDS:-120}
    depends_on:
      - redis

volumes:
  db_data:
  uploads_data:
